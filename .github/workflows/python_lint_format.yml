name: Python Linting and Formatting

on:
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        python-version: [3.12]
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: PIP Install 
      run: |
        python -m pip install --upgrade pip
        pip install ruff uv
    - name: Verify environment
      run: uv pip list
    - name: Install Dependancies
      run: |
        uv sync
    - name: Run formatting
      run: |
        uv run ruff format
    - name: Run linting
      run: |
        uv run ruff check
